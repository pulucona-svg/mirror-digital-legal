    <!-- Left Wing / Page -->
    <path d="M12 28.5V14.5C12 13.6716 12.6716 13 13.5 13H19C20.1046 13 21 13.8954 21 15V29C21 29.5523 20.5523 30 20 30H13.5C12.6716 30 12 29.3284 12 28.5Z" fill="#3B82F6"/>
